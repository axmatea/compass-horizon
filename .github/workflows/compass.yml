name: COMPASS core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: compass_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACQUISITION_TEST_DATABASE_URL: postgresql://compass_test:local-test-only@127.0.0.1:5432/compass_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compass/package-lock.json
      - run: npm ci --prefix compass
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --prefix compass --audit-level=low
