<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application</title><link rel="stylesheet" href="/styles.css"><script src="/client-core.js" defer></script><script src="/app.js" defer></script></head><body>
<section id="auth-panel" class="auth-panel"><p class="eyebrow">Your workspace</p><h1 id="auth-title">Sign in</h1><p>Local application · use a .test email.</p><form id="auth-form" method="post"><label for="auth-name">Name</label><input id="auth-name" name="name" autocomplete="name" maxlength="80"><label for="auth-email">Email</label><input id="auth-email" type="email" name="email" autocomplete="email" maxlength="254" required><label for="auth-password">Password</label><input id="auth-password" type="password" name="password" autocomplete="current-password" minlength="12" maxlength="128" required><label class="check"><input id="auth-signup" type="checkbox"> Create a new account</label><button id="auth-submit">Continue</button></form><p id="auth-status" role="status"></p></section>
<main id="workspace" hidden><header class="app-header"><div><p class="eyebrow">Workspace</p><h1 id="app-title"></h1><p id="app-description"></p></div><button id="sign-out" hidden>Sign out</button></header><div class="layout"><section class="collection"><div class="section-heading"><h2 id="entity-title"></h2><span id="record-count">0</span><button id="refresh">Refresh</button></div><p id="empty-state" hidden>No records yet.</p><div id="records"></div></section><aside class="editor"><h2 id="form-title"></h2><form id="record-form" method="post"><div id="record-fields"></div><div class="form-actions"><button id="save-record" type="button">Create</button><button id="cancel-edit" type="button" hidden>Cancel</button></div></form></aside></div><p id="app-status" class="app-status" role="status" aria-live="polite"></p></main>
</body></html>
