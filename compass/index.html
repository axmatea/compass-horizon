<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><meta name="compass-design" content="white-instrument">
<title>COMPASS — Websites &amp; mobile apps</title>
<meta name="description" content="Original website and mobile app templates. Explore the design. Make it yours.">
<link rel="canonical" href="https://mycompass.world/">
<meta property="og:type" content="website"><meta property="og:site_name" content="COMPASS"><meta property="og:title" content="COMPASS — Websites &amp; mobile apps"><meta property="og:description" content="Original templates. A better starting point."><meta property="og:url" content="https://mycompass.world/"><meta property="og:image" content="https://mycompass.world/assets/og.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="COMPASS website preview, for desktop and phone.">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="COMPASS — Websites &amp; mobile apps"><meta name="twitter:description" content="Original templates. A better starting point."><meta name="twitter:image" content="https://mycompass.world/assets/og.jpg"><meta name="twitter:image:alt" content="COMPASS website preview, for desktop and phone.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/src/site/fonts/inter-var-latin.woff2" crossorigin>
<link rel="stylesheet" href="/src/marketplace/marketplace.css">
<script type="module" src="/src/marketplace/marketplace.mjs"></script>
<script type="module" src="/src/site/public-navigation.mjs"></script>
</head>
<body>
<a class="skip" href="#catalog">Skip to templates</a>
<header class="bar" data-public-header>
<a class="brand" href="/" aria-label="COMPASS homepage"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M4 12 15 5v16L4 28Zm14-4 10 6v14l-10-6Z"/></svg><span>COMPASS</span></a>
<nav class="menu" data-public-nav aria-label="Primary"><a class="public-nav-secondary" href="#catalog" aria-current="page">Templates</a><a href="/studio">Studio</a><a href="/demo">Build your own <span aria-hidden="true">↗</span></a><a class="public-account-entry" data-public-account href="/create?view=account" title="Sign in to reopen your account projects">Sign in</a><button class="public-tour-trigger" type="button" data-platform-tour-trigger hidden>Platform Tour</button></nav>
</header>
<main id="top">
<section class="market-intro wrap" aria-labelledby="market-title">
  <h1 id="market-title">What would you like to build?</h1>
  <form class="market-start-form" id="market-start" method="post" action="/create" hidden>
    <label class="sr" for="market-idea">Describe your project</label>
    <textarea id="market-idea" name="idea" rows="2" minlength="3" maxlength="500" required placeholder="A project tracker for a small design studio…"></textarea>
    <div class="market-start-actions">
      <label class="market-start-target"><span class="sr">Project type</span><select name="projectType">
        <option value="app">Web app</option><option value="website">Website</option><option value="ios">iOS app</option><option value="android">Android app</option><option value="cross-platform">iOS &amp; Android</option>
      </select></label>
      <button class="market-start-button" type="submit">Build <span aria-hidden="true">↗</span></button>
    </div>
    <p class="market-start-status" id="market-start-status" role="status"></p>
  </form>
  <noscript><p><a href="/create">Start a project ↗</a></p></noscript>
</section>
<section class="market-catalog wrap" id="catalog" aria-label="Templates">
<div class="market-toolbar"><div class="market-filters" role="group" aria-label="Template type"><button type="button" data-template-kind="all" aria-pressed="true">All</button><button type="button" data-template-kind="website" aria-pressed="false">Websites</button><button type="button" data-template-kind="mobile" aria-pressed="false">Mobile apps</button></div><label class="market-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr">Search templates</span><input id="template-search" type="search" placeholder="Search templates" maxlength="120" autocomplete="off"></label></div>
<p class="market-link-error" id="template-link-error" role="status" hidden></p>
<p class="sr" id="market-status" role="status" aria-live="polite">Loading templates.</p>
<div class="market-grid" id="template-catalog" aria-busy="true"></div>
<div class="market-empty" id="template-empty" hidden><h2>No matches.</h2><p>Try another name or category.</p><button class="market-button" id="template-reset" type="button">Reset filters</button></div>
<noscript><p class="market-noscript">Enable JavaScript to browse previews. You can still visit the <a href="/demo">builder</a> or <a href="/studio">Studio</a>.</p></noscript>
</section>
<div class="market-below wrap"><a href="/demo">Build your own <span aria-hidden="true">↗</span></a><a href="#film" data-open-film>Watch the film <span aria-hidden="true">↗</span></a></div>
<details class="market-film" id="film"><summary>COMPASS film</summary>
<!-- The server inserts the approved product film with accessible controls. -->
<div id="compass-video" data-founder-slot="video" hidden></div>
</details>
</main>
<footer class="foot wrap"><a class="brand" href="/" aria-label="COMPASS homepage"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M4 12 15 5v16L4 28Zm14-4 10 6v14l-10-6Z"/></svg><span>COMPASS</span></a><nav aria-label="Footer"><a href="/privacy">Privacy</a><a href="/studio">Studio</a><a href="https://aimedia.global" rel="noopener noreferrer">AX Media Global</a></nav><p>© 2026 COMPASS</p></footer>
</body>
</html>
